{{ if .Values.multicluster.enabled }}
{{- $cp := .Values.multicluster.clusterGateway.credentialPlugins }}
{{- $aws := $cp.aws }}
{{- $plugins := or $aws.enabled $cp.custom }}
{{- if and $aws.enabled $aws.irsa.roleArn $aws.podIdentity.enabled }}
{{- fail "multicluster.clusterGateway.credentialPlugins.aws: set irsa.roleArn or podIdentity.enabled, not both" }}
{{- end }}
{{- if and $aws.enabled $aws.irsa.roleArn (not $aws.region) }}
{{- fail "multicluster.clusterGateway.credentialPlugins.aws.region is required with irsa.roleArn" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cluster-gateway
  namespace: {{ .Release.Namespace }}
  labels:
  {{- include "kubevela.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.multicluster.clusterGateway.replicaCount }}
  selector:
    matchLabels:
    {{- include "kubevela-cluster-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "9443"
        prometheus.io/scrape: "true"
        prometheus.io/scheme: "https"
        {{- if and $aws.enabled $aws.podIdentity.enabled }}
        # Keep the Pod Identity webhook's injection off the gateway container.
        eks.amazonaws.com/skip-containers: {{ include "kubevela.fullname" . }}-cluster-gateway
        {{- end }}
      labels:
      {{- include "kubevela-cluster-gateway.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kubevela-cluster-gateway.serviceAccountName" . }}
      securityContext:
      {{- if $plugins }}
      {{- toYaml (merge (deepCopy .Values.podSecurityContext) (dict "fsGroup" $cp.fsGroup)) | nindent 8 }}
      {{- else }}
      {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "kubevela.fullname" . }}-cluster-gateway
          securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - "apiserver"
            - "--secure-port={{ .Values.multicluster.clusterGateway.port }}"
            - "--secret-namespace={{ .Release.Namespace }}"
            - "--feature-gates=ClientIdentityPenetration={{ .Values.authentication.enabled }}"
            - "--cluster-gateway-proxy-config=/etc/proxy-config/config.yaml"
            {{- if .Values.multicluster.clusterGateway.secureTLS.enabled }}
            - "--tls-cert-file={{ .Values.multicluster.clusterGateway.secureTLS.certPath }}/tls.crt"
            - "--tls-private-key-file={{ .Values.multicluster.clusterGateway.secureTLS.certPath }}/tls.key"
            {{- end }}
            - "--authorization-always-allow-paths=/healthz,/readyz,/livez,/metrics"
            {{- if $plugins }}
            - "--credential-plugin-dir=/var/run/cluster-gateway/plugins"
            {{- end }}
          image: {{ .Values.imageRegistry }}{{ .Values.multicluster.clusterGateway.image.repository }}:{{ .Values.multicluster.clusterGateway.image.tag }}
          imagePullPolicy: {{ .Values.multicluster.clusterGateway.image.pullPolicy }}
          resources:
          {{- toYaml .Values.multicluster.clusterGateway.resources | nindent 12 }}
          ports:
            - containerPort: {{ .Values.multicluster.clusterGateway.port }}
          volumeMounts:
            - mountPath: /etc/proxy-config
              name: proxy-config
          {{ if .Values.multicluster.clusterGateway.secureTLS.enabled }}
            - mountPath: {{ .Values.multicluster.clusterGateway.secureTLS.certPath }}
              name: tls-cert-vol
              readOnly: true
          {{- end }}
          {{- if $plugins }}
            - mountPath: /var/run/cluster-gateway/plugins
              name: credential-plugins
          {{- end }}
        {{- if $aws.enabled }}
        - name: credential-plugin-aws
          image: {{ .Values.imageRegistry }}{{ $aws.image.repository }}:{{ $aws.image.tag | default .Values.multicluster.clusterGateway.image.tag }}
          imagePullPolicy: {{ .Values.multicluster.clusterGateway.image.pullPolicy }}
          args:
            - --socket=/var/run/cluster-gateway/plugins/aws.sock
            - --allow-base-identity={{ $aws.allowBaseIdentity }}
            - --allowed-role-arns={{ join "," $aws.allowedRoleArns }}
            - --session-name={{ $aws.sessionName }}
          env:
            {{- if $aws.region }}
            - name: AWS_REGION
              value: {{ $aws.region | quote }}
            {{- end }}
            - name: AWS_STS_REGIONAL_ENDPOINTS
              value: regional
            {{- if $aws.irsa.roleArn }}
            - name: AWS_ROLE_ARN
              value: {{ $aws.irsa.roleArn | quote }}
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/eks.amazonaws.com/serviceaccount/token
            {{- end }}
            {{- if $aws.podIdentity.enabled }}
            - name: AWS_CONTAINER_CREDENTIALS_FULL_URI
              value: http://169.254.170.23/v1/credentials
            - name: AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE
              value: /var/run/secrets/pods.eks.amazonaws.com/serviceaccount/eks-pod-identity-token
            {{- end }}
          volumeMounts:
            - mountPath: /var/run/cluster-gateway/plugins
              name: credential-plugins
            {{- if $aws.irsa.roleArn }}
            - mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
              name: aws-irsa-token
              readOnly: true
            {{- end }}
            {{- if $aws.podIdentity.enabled }}
            - mountPath: /var/run/secrets/pods.eks.amazonaws.com/serviceaccount
              name: aws-pod-identity-token
              readOnly: true
            {{- end }}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          {{- with $aws.resources }}
          resources:
          {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- range $cp.custom }}
        - {{- toYaml (mergeOverwrite (deepCopy .) (dict "volumeMounts" (append (default list .volumeMounts) (dict "name" "credential-plugins" "mountPath" "/var/run/cluster-gateway/plugins")))) | nindent 10 }}
        {{- end }}
      volumes:
        - configMap:
            defaultMode: 420
            name: {{ .Release.Name }}-cluster-gateway-proxy-config
          name: proxy-config
      {{ if .Values.multicluster.clusterGateway.secureTLS.enabled }}
        - name: tls-cert-vol
          secret:
            defaultMode: 420
            secretName: {{ template "kubevela.fullname" . }}-cluster-gateway-tls-v2
      {{ end }}
      {{- if $plugins }}
        - name: credential-plugins
          emptyDir: {}
      {{- end }}
      {{- if and $aws.enabled $aws.irsa.roleArn }}
        - name: aws-irsa-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 86400
                  path: token
      {{- end }}
      {{- if and $aws.enabled $aws.podIdentity.enabled }}
        - name: aws-pod-identity-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: pods.eks.amazonaws.com
                  expirationSeconds: 86400
                  path: eks-pod-identity-token
      {{- end }}
      {{- with $cp.volumes }}
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
      {{ if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
      {{ else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "kubevela-cluster-gateway.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
              weight: 100
      {{ end }}
      {{- with .Values.tolerations }}
      tolerations:
      {{- toYaml . | nindent 8 }}
      {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-cluster-gateway-proxy-config
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    apiVersion: cluster.core.oam.dev/v1alpha1
    kind: ClusterGatewayProxyConfiguration
    spec:
      clientIdentityExchanger:
        rules:
          - name: super-user
            source:
              group: kubevela:ux
            type: PrivilegedIdentityExchanger
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-cluster-gateway-service
  namespace: {{ .Release.Namespace }}
spec:
  selector:
  {{- include "kubevela-cluster-gateway.selectorLabels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .Values.multicluster.clusterGateway.port }}
      targetPort: {{ .Values.multicluster.clusterGateway.port }}
      name: default
---
# 1.  Check whether APIService ""v1alpha1.cluster.core.oam.dev" is already present in the cluster
# 2.a If the APIService doesn't exist, create it.
# 2.b If the APIService exists without helm-chart related annotation, skip creating it to the
#     cluster because the APIService can be managed by an external controller.
# 2.c If the APIService exists with valid helm-chart annotations, which means that the APIService
#     is previously managed by helm commands, hence update the APIService consistently.
{{ $apiSvc := (lookup "apiregistration.k8s.io/v1" "APIService" "" "v1alpha1.cluster.core.oam.dev") }}
{{ $shouldAdopt := (not $apiSvc) }}
{{ if not $shouldAdopt }}
  {{ if $apiSvc.metadata.annotations }}
    {{ $shouldAdopt = (index ($apiSvc).metadata.annotations "meta.helm.sh/release-name") }}
  {{ end }}
{{ end }}
{{ if $shouldAdopt }}
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.cluster.core.oam.dev
  annotations:
    {{- if and .Values.multicluster.clusterGateway.secureTLS.enabled .Values.multicluster.clusterGateway.secureTLS.certManager.enabled }}
    cert-manager.io/inject-ca-from: "{{ .Release.Namespace }}/{{ template "kubevela.fullname" . }}-cluster-gateway-tls-v2"
    {{- end }}
  labels:
    api: cluster-extension-apiserver
    apiserver: "true"
spec:
  version: v1alpha1
  group: cluster.core.oam.dev
  groupPriorityMinimum: 2000
  service:
    name: {{ .Release.Name }}-cluster-gateway-service
    namespace: {{ .Release.Namespace }}
    port: {{ .Values.multicluster.clusterGateway.port }}
  versionPriority: 10
  insecureSkipTLSVerify: {{ not .Values.multicluster.clusterGateway.secureTLS.enabled }}
  {{ if .Values.multicluster.clusterGateway.secureTLS.enabled }}
  {{- /* Preserve an already-valid caBundle on upgrade so we don't reset it to  the
         Cg== placeholder before the patch Job re-runs 
         $apiSvc is the existing APIService looked up above; fall back to the
         placeholder only on fresh install or when it still holds the placeholder. */}}
  {{- $caBundle := "Cg==" }}
  {{- if $apiSvc }}
    {{- if $apiSvc.spec }}
      {{- if hasKey $apiSvc.spec "caBundle" }}
        {{- if ne $apiSvc.spec.caBundle "Cg==" }}
          {{- $caBundle = $apiSvc.spec.caBundle }}
        {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
  caBundle: {{ $caBundle }}
  {{ end }}
{{ end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubevela.fullname" . }}:cluster-gateway:proxy
rules:
  - apiGroups: [ "cluster.core.oam.dev" ]
    resources: [ "clustergateways/proxy" ]
    verbs: [ "get", "list", "watch", "create", "update", "patch", "delete" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubevela.fullname" . }}:cluster-gateway:proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubevela.fullname" . }}:cluster-gateway:proxy
subjects:
  - kind: Group
    name: kubevela:client
    apiGroup: rbac.authorization.k8s.io
  - kind: ServiceAccount
    name: {{ include "kubevela.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{ end }}
