{{- /* Setup templates the vela CLI renders for `vela cluster setup` and `join --provider`. */}}
{{- if .Values.multicluster.enabled }}
{{- $cp := .Values.multicluster.clusterGateway.credentialPlugins }}
{{- if $cp.aws.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: credential-provider-aws
  namespace: {{ .Release.Namespace }}
  labels:
    cluster.core.oam.dev/credential-provider: aws
  {{- include "kubevela.labels" . | nindent 4 }}
data:
  template.cue: |
{{ .Files.Get "credential-providers/aws.cue" | indent 4 }}
{{- end }}
{{- range $name, $template := $cp.templates }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: credential-provider-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    cluster.core.oam.dev/credential-provider: {{ $name }}
  {{- include "kubevela.labels" $ | nindent 4 }}
data:
  template.cue: |
{{ $template | indent 4 }}
{{- end }}
{{- end }}
