                                    type: string
                                  type: array
                                componentTypes:
                                  items:
                                    type: string
                                  type: array
                                oamTypes:
                                  items:
                                    type: string
                                  type: array
                                resourceNames:
                                  items:
                                    type: string
                                  type: array
                                resourceTypes:
                                  items:
                                    type: string
                                  type: array
                                traitTypes:
                                  items:
                                    type: string
                                  type: array
