apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.shop.example.com
spec:
  group: shop.example.com
  names:
    kind: Widget
    plural: widgets
    singular: widget
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [mode]
              properties:
                replicas: {type: integer, minimum: 1, maximum: 9, default: 1}
                weight: {type: integer, minimum: 0, exclusiveMinimum: true}
                ratio: {type: number, minimum: 0, maximum: 1, default: 0.5}
                scale: {type: number, default: 1.5}
                mode: {type: string, enum: [fast, safe], default: safe}
                size: {type: string, pattern: '^[0-9]+Gi$', default: 1Gi}
                name: {type: string, minLength: 3, maxLength: 9, default: abc}
                code: {type: string, minLength: 2}
                port: {x-kubernetes-int-or-string: true, default: 8080}
                enabled: {type: boolean, default: true}
                labels: {type: object, additionalProperties: {type: string}}
                limits: {type: object, additionalProperties: {type: integer}}
                config: {type: object, x-kubernetes-preserve-unknown-fields: true}
                args: {type: array, items: {type: string}}
                ports: {type: array, items: {type: integer, minimum: 1, maximum: 65535}}
                rules:
                  type: array
                  items:
                    type: object
                    required: [host]
                    properties:
                      host: {type: string}
                      weight: {type: integer, minimum: 0, default: 1}
                backend:
                  type: object
                  required: [service]
                  properties:
                    service: {type: string}
                    timeout: {type: integer, minimum: 1, default: 30}
                    tls:
                      type: object
                      properties:
                        enabled: {type: boolean}
                        minVersion: {type: string, enum: ["1.2", "1.3"], default: "1.2"}
