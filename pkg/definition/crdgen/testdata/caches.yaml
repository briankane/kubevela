apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: caches.shop.example.com
spec:
  group: shop.example.com
  names:
    kind: Cache
    plural: caches
    singular: cache
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: false
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size: {type: string}
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [version]
              properties:
                version:
                  type: string
                  description: Redis version to run. Must be one the operator ships.
                engine:
                  type: string
                  enum: [redis, valkey]
                  default: redis
                  description: Which engine serves the cache.
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 9
                  default: 1
                  description: Replicas of the cache.
                persistence:
                  type: object
                  description: Keeps the data across restarts.
                  properties:
                    enabled: {type: boolean}
                    size:
                      type: string
                      pattern: '^[0-9]+Gi$'
                      description: Size of the volume, in Gi.
                resources:
                  type: object
                  properties:
                    limits:
                      type: object
                      additionalProperties:
                        x-kubernetes-int-or-string: true
                tolerations:
                  type: array
                  items:
                    type: object
                    properties:
                      key: {type: string}
                      operator: {type: string, enum: [Exists, Equal]}
                      effect: {type: string}
                config:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: Raw settings passed to the engine.
                name:
                  type: string
                  minLength: 3
                  maxLength: 40
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: {type: string}
                      status: {type: string}
                      reason: {type: string}
                      message: {type: string}
