apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cachebackups.shop.example.com
spec:
  group: shop.example.com
  names:
    kind: CacheBackup
    plural: cachebackups
    singular: cachebackup
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [cacheRef, schedule]
              properties:
                cacheRef:
                  description: The Cache to back up.
                  type: object
                  required: [name]
                  properties:
                    name: {type: string}
                schedule:
                  description: When to back up, as a cron expression.
                  type: string
                retention:
                  description: Days a backup is kept.
                  type: integer
                  default: 7
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: {type: string}
                      status: {type: string}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cacheusers.shop.example.com
spec:
  group: shop.example.com
  names:
    kind: CacheUser
    plural: cacheusers
    singular: cacheuser
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [cluster]
              properties:
                cluster:
                  description: Where the user is made.
                  type: object
                  required: [name]
                  properties:
                    name:
                      description: Name of the Cache.
                      type: string
                access:
                  type: string
                  enum: [read, readwrite]
                  default: read
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: not-a-crd
