# A trial of KubeVela's heavier e2e jobs on KWOK with a container node instead of KinD, to
# measure whether they fit a hosted runner. Trial only: runs on a push to its own branch or by
# hand (workflow_dispatch needs the file on the default branch), never on a PR.
name: KWOK trial

on:
  push:
    branches: [test/kwok-ci-trial]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trial:
    name: ${{ matrix.job }} on KWOK
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        job: [config-upgrade, addon-module]
    steps:
      - name: Check out code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'

      - name: Cache kwokctl's control-plane downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.kwok/cache
          key: kwok-cache-v0.8.0-k8s-1.36-${{ runner.os }}-${{ runner.arch }}

      - name: Build and fetch the tools
        run: |
          hack/kwok-trial/kwok-spike/ci-trial/build.sh . "$RUNNER_TEMP/bin"
          mkdir -p bin && cp "$RUNNER_TEMP/bin/vela" bin/vela

      - name: Run ${{ matrix.job }}
        env:
          REPO: ${{ github.workspace }}
          BIN: ${{ runner.temp }}/bin
          OUT: ${{ runner.temp }}/out
        run: hack/kwok-trial/kwok-spike/ci-trial/trial.sh ${{ matrix.job }}

      - name: Upload logs, timings and docker stats
        if: ${{ always() }}
        uses: actions/upload-artifact@134dcf33c0b9454c4b17a936843d7e21dccdc335 # v4.3.6
        with:
          name: kwok-trial-${{ matrix.job }}
          path: ${{ runner.temp }}/out
